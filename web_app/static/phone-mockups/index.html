<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ed">
  <title>Smart Screen: phone editor mock-ups</title>
  <link rel="stylesheet" href="/static/phone-mockups/mockups.css">
  <script type="module" src="/static/phone-mockups/mockups.js"></script>
</head>
<body>
  <!--
    TEMPORARY. Pictures of the planned phone editor, shown at their real size on a phone, so
    that the sizes can be judged in the hand. Nothing here is the editor: the pictures are
    mock-ups, and a tap only moves to the next picture.
    The plan is docs/mobile-support-plan.md. This folder goes away once the design is settled.
  -->

  <!-- Shown first, and again after leaving full screen. A page may only go full screen after a tap. -->
  <main class="start" id="start">
    <h1>Phone editor mock-ups</h1>
    <p>Pictures of the planned editor, at the size it would have on this phone.
       Tap a picture to see the next one.</p>
    <button class="start__button" id="start-button" type="button">Show the pictures</button>
    <p class="start__note" id="start-note"></p>
  </main>

  <!-- The picture, filling the screen. -->
  <section class="viewer" id="viewer" hidden>
    <img class="viewer__picture" id="picture" alt="">
    <p class="viewer__caption" id="caption"></p>
    <p class="viewer__turn" id="turn-message" hidden>Turn your phone sideways</p>
  </section>
</body>
</html>
